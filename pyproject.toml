[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "agentforge-sinks-plugin"
version = "1.0.0"
description = "Test-rig plugin for AgentForge event sinks — emit events via TopicBus, verify PostgresEventSinkProvider + TappsBrainEventSinkProvider delivery."
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "pydantic>=2.0",
]

[project.entry-points."agentforge.plugins"]
sinks-test = "agentforge_sinks"

[tool.hatch.build.targets.wheel]
packages = ["agentforge_sinks"]

[tool.hatch.build.targets.wheel.force-include]
"agentforge_sinks/plugin.json" = "agentforge_sinks/plugin.json"
"agentforge_sinks/agents/sinks_test_agent/AGENT.md" = "agentforge_sinks/agents/sinks_test_agent/AGENT.md"

[dependency-groups]
dev = [
    "pytest>=9.0",
    "httpx>=0.28",
]
